[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openfda-mcp"
version = "0.1.0"
description = "A safe, model-friendly MCP server for the openFDA API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "EDETEK" }]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2.0,<3",
  "pydantic>=2.10,<3",
]

[project.scripts]
openfda-mcp = "openfda_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["openfda_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

