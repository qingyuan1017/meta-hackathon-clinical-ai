services:
  cdisc-mcp:
    build:
      context: ./cdisc-mcp
    env_file:
      - path: .env
        required: false
    environment:
      CDISC_MCP_TRANSPORT: streamable-http
      CDISC_MCP_HOST: 0.0.0.0
      CDISC_MCP_PORT: 8001
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  clinicalgov-mcp:
    build:
      context: ./clinicalgov-mcp
    env_file:
      - path: .env
        required: false
    environment:
      CLINICALGOV_MCP_TRANSPORT: streamable-http
      CLINICALGOV_MCP_HOST: 0.0.0.0
      CLINICALGOV_MCP_PORT: 8003
    ports:
      - "127.0.0.1:8003:8003"
    restart: unless-stopped

  openfda-mcp:
    build:
      context: ./openfda_mcp
    env_file:
      - path: .env
        required: false
    environment:
      OPENFDA_MCP_ALLOWED_HOSTS: >-
        openfda-mcp:8000,localhost:${OPENFDA_MCP_PORT:-8765},127.0.0.1:${OPENFDA_MCP_PORT:-8765}
    ports:
      - "127.0.0.1:${OPENFDA_MCP_PORT:-8765}:8000"
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      CLINICALGOV_MCP_URL: http://clinicalgov-mcp:8003/mcp
      OPENFDA_MCP_URL: http://openfda-mcp:8000/mcp
    ports:
      - "8000:8000"
    volumes:
      - clinical-ai-data:/data
    depends_on:
      clinicalgov-mcp:
        condition: service_healthy
      openfda-mcp:
        condition: service_healthy
    restart: unless-stopped

  workbench-mcp:
    build:
      context: ./workbench-mcp
    env_file:
      - path: .env
        required: false
    environment:
      WORKBENCH_API_URL: http://api:8000/api/v1
      WORKBENCH_MCP_TRANSPORT: streamable-http
      WORKBENCH_MCP_HOST: 0.0.0.0
      WORKBENCH_MCP_PORT: 8002
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clinical-ai-data:
