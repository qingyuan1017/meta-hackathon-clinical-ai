services:
  minio:
    build:
      context: ./minio
    image: clinical-ai-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clinical-ai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clinical-ai-development-only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - clinical-ai-objects:/data
    restart: unless-stopped

  sdtm-runner:
    build:
      context: ./sdtm-runner
    networks:
      - sdtm-runner-net
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 96
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  cdisc-mcp:
    build:
      context: ./cdisc-mcp
    env_file:
      - path: .env
        required: false
    environment:
      CDISC_MCP_TRANSPORT: streamable-http
      CDISC_MCP_HOST: 0.0.0.0
      CDISC_MCP_PORT: 8001
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  clinicalgov-mcp:
    build:
      context: ./clinicalgov-mcp
    env_file:
      - path: .env
        required: false
    environment:
      CLINICALGOV_MCP_TRANSPORT: streamable-http
      CLINICALGOV_MCP_HOST: 0.0.0.0
      CLINICALGOV_MCP_PORT: 8003
    ports:
      - "127.0.0.1:8003:8003"
    restart: unless-stopped

  openfda-mcp:
    build:
      context: ./openfda_mcp
    env_file:
      - path: .env
        required: false
    environment:
      OPENFDA_MCP_ALLOWED_HOSTS: >-
        openfda-mcp:8000,localhost:${OPENFDA_MCP_PORT:-8765},127.0.0.1:${OPENFDA_MCP_PORT:-8765}
    ports:
      - "127.0.0.1:${OPENFDA_MCP_PORT:-8765}:8000"
    restart: unless-stopped

  bioportal-mcp:
    build:
      context: ./bioportal-mcp
    env_file:
      - path: .env
        required: false
    environment:
      BIOPORTAL_MCP_TRANSPORT: streamable-http
      BIOPORTAL_MCP_HOST: 0.0.0.0
      BIOPORTAL_MCP_PORT: 8004
    ports:
      - "127.0.0.1:8004:8004"
    restart: unless-stopped

  pubmed-mcp:
    build:
      context: ./pubmed-mcp
    env_file:
      - path: .env
        required: false
    environment:
      PUBMED_MCP_TRANSPORT: streamable-http
      PUBMED_MCP_HOST: 0.0.0.0
      PUBMED_MCP_PORT: 8005
    ports:
      - "127.0.0.1:8005:8005"
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-clinical-ai}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-clinical-ai-development-only}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-clinical-ai-inputs}
      OBJECT_STORAGE_SECURE: "false"
      CDISC_MCP_URL: http://cdisc-mcp:8001/mcp
      CLINICALGOV_MCP_URL: http://clinicalgov-mcp:8003/mcp
      OPENFDA_MCP_URL: http://openfda-mcp:8000/mcp
      BIOPORTAL_MCP_URL: http://bioportal-mcp:8004/mcp
      PUBMED_MCP_URL: http://pubmed-mcp:8005/mcp
      SDTM_RUNNER_URL: http://sdtm-runner:8010
    ports:
      - "8000:8000"
    volumes:
      - clinical-ai-data:/data
    depends_on:
      minio:
        condition: service_started
      sdtm-runner:
        condition: service_healthy
      cdisc-mcp:
        condition: service_healthy
      clinicalgov-mcp:
        condition: service_healthy
      openfda-mcp:
        condition: service_healthy
      bioportal-mcp:
        condition: service_healthy
      pubmed-mcp:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - sdtm-runner-net

  workbench-mcp:
    build:
      context: ./workbench-mcp
    env_file:
      - path: .env
        required: false
    environment:
      WORKBENCH_API_URL: http://api:8000/api/v1
      WORKBENCH_MCP_TRANSPORT: streamable-http
      WORKBENCH_MCP_HOST: 0.0.0.0
      WORKBENCH_MCP_PORT: 8002
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clinical-ai-data:
  clinical-ai-objects:

networks:
  sdtm-runner-net:
    internal: true
