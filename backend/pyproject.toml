[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ai-workbench-api"
version = "0.1.0"
description = "FastAPI service for the Clinical AI Artifact Workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "openai>=1.55,<3",
  "mcp>=2,<3",
  "python-multipart>=0.0.17,<1",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "lxml>=5.3,<7",
  "reportlab>=4.2,<5",
  "usdm==0.67.0",
  "cdisc-rules-engine==0.17.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agents" = ["*.md"]
"app.agents.protocol_extraction" = ["*.md"]
"app.agents.clinical_document" = ["*.md"]
"app.agents.edc_design" = ["*.md"]
"app.agents.sdtm" = ["*.md"]
"app.agents.tlf" = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
