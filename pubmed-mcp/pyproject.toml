[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ai-pubmed-mcp"
version = "0.1.0"
description = "Standalone read-only PubMed MCP service using NCBI E-utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
]

[project.scripts]
pubmed-mcp = "pubmed_mcp.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
include = ["pubmed_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
